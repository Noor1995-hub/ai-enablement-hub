# Dependabot version updates for the frontend (npm), the backend (uv) and the workflows.
#
# Shape (2026-09-28, Matthias): one grouped PR per ecosystem per MONTH, minor + patch only.
# Major version bumps are NOT proposed: they change behaviour, depend on each other and are
# planned as deliberate work in a GitHub issue (e.g. #45, the frontend tooling upgrade).
# A 7-day cooldown keeps a release out until it has been public for a week, since most malicious
# or broken releases are yanked within days.
#
# Security is separate: Dependabot ALERTS + SECURITY UPDATES are enabled in the repo settings
# (turned on 2026-09-28). A security PR is opened whenever a dependency has a known
# vulnerability, is not bound by this schedule or open-pull-requests-limit, and usually ships
# as a patch release (so the major-version ignore below does not block it).
#
# Dependabot PRs run the normal CI (it needs no secrets) but are NOT reviewed by Claude: the
# review workflow has no access to secrets on Dependabot-authored PRs, by design. Merging one is
# the same as any PR: both required checks green, read the changelog for a major, squash-merge.
# Nothing is deployed until someone presses Deploy.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

# Docker base images are deliberately not covered: the Dockerfile tags float within a runtime line
# (node:22-alpine, python:3.13-slim-bookworm, postgres:18), so every build already picks up patches;
# the only PRs Dependabot could open are runtime-line changes, which are decisions, not updates.
