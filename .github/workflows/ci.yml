# CI for the AI Enablement Hub — runs on every pull request and every push to main.
#
# JOB NAMES ARE LOAD-BEARING. The `main-ci` ruleset (.github/rulesets/main-ci.json) requires
# the `name:` of the backend and frontend jobs as status-check contexts. Renaming a job here
# without updating the ruleset blocks every merge. The `staged` job is deliberately NOT required:
# it is a ratchet on known debt (see the job) and goes red only when a change adds findings.
#
# The backend job runs the real pytest suite against a throwaway Postgres 18 service container
# (not the shared Azure test DB): tests/conftest.py derives its DSN from ALEMBIC_DATABASE_URL,
# swaps the database name to ai-enablement-hub-test, creates the schema from Base.metadata and
# forces email/storage/llm settings to None — so no *real* secrets are needed here. AUTH__JWT_SECRET
# below is a required-but-not-secret placeholder (Settings.auth has no default; see its env block).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Deny by default; each job grants only what it needs (way-of-working 2.8).
permissions: {}

concurrency:
  # Superseded PR runs are cancelled; pushes to main never are.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (format + lint + tests)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: ai-enablement-hub-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d ai-enablement-hub-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest asserts the database name ends in "-test" before it drops/creates the schema.
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://hub:hub@localhost:5432/ai-enablement-hub-test
      # Settings.auth has no default (core/configs/auth.py) so the app refuses to start
      # without it — conftest imports src.main at collection time, before any test can
      # monkeypatch it. Not a real secret; only needs >=32 chars of entropy to pass
      # AuthSettings' validator. No email/storage/llm secrets are needed (all default to None).
      AUTH__JWT_SECRET: ci-only-placeholder-jwt-secret-not-a-real-value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked, all extras — llm_service imports anthropic at module level)
        run: uv sync --frozen --all-extras
      - name: Format check
        run: uv run poe format-check
      - name: Lint (src, tests, alembic)
        run: uv run poe lint-src
      - name: Type check (src)
        run: uv run poe ty-src
      - name: Tests with coverage
        # -n 4 rather than -n auto: the runner has 4 vCPUs and conftest's auto rule would leave
        # only 2 workers. Coverage floor 90% (measured 96% on 2026-09-24): a PR that drops line
        # coverage of src/ below it turns this required check red. Raise the floor, never lower it.
        run: uv run pytest tests -n 4 --cov=src --cov-report=xml --cov-report=term --cov-fail-under=90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  frontend:
    name: frontend (typecheck + lint + build)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # API-types drift check: regenerate src/api/schema.d.ts from the backend (imports the app,
      # no server, no database) and fail if it differs from the committed file.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: API types match the backend
        env:
          # Settings.auth has no default; a placeholder, as in the backend job.
          AUTH__JWT_SECRET: ci-only-placeholder-jwt-secret-not-a-real-value
        run: |
          (cd ../backend && uv sync --frozen --no-dev --quiet)
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::frontend/src/api/schema.d.ts is out of date with the backend API. Run \`npm run gen:api\` in frontend/ and commit the result."
            exit 1
          }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  staged:
    # Not required by the ruleset. A ratchet on the known debt: ruff on backend/scripts and ty on
    # the whole backend (src/ itself is clean and type-checked by the backend job). Green while the
    # count is at or below the baseline, red only when a change ADDS findings. The counts land in
    # the run summary and as a warning annotation. When a PR fixes debt, lower the baseline in the
    # same PR so the ratchet tightens; never raise it.
    name: staged (scripts lint + ty) — not required
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUFF_SCRIPTS_BASELINE: 30
      TY_BASELINE: 21
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --all-extras
      - name: Count debt and compare with the baseline
        run: |
          ruff_n=$(uv run ruff check scripts --output-format json --exit-zero | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          # ty exits 0 (clean) or 1 (diagnostics found); anything else means it did not run, and
          # a count of 0 from a crashed ty must not pass as "no debt".
          set +e
          ty_out=$(uv run ty check . --output-format concise)
          ty_rc=$?
          set -e
          if [ "$ty_rc" -gt 1 ]; then
            echo "$ty_out"
            echo "::error::ty exited with $ty_rc - it did not run, so the ty count is unknown"
            exit 1
          fi
          ty_n=$(echo "$ty_out" | grep -cE '^[^ ]+:[0-9]+:[0-9]+: (error|warning)' || true)
          {
            echo "### Known debt (ratchet)"
            echo "| check | findings | baseline |"
            echo "|---|---|---|"
            echo "| ruff \`scripts/\` | $ruff_n | $RUFF_SCRIPTS_BASELINE |"
            echo "| ty (whole backend) | $ty_n | $TY_BASELINE |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Known debt::ruff scripts/ $ruff_n (baseline $RUFF_SCRIPTS_BASELINE), ty $ty_n (baseline $TY_BASELINE)"
          fail=0
          if [ "$ruff_n" -gt "$RUFF_SCRIPTS_BASELINE" ]; then
            echo "::error::ruff on scripts/ found $ruff_n findings, baseline is $RUFF_SCRIPTS_BASELINE - this change adds lint debt"
            uv run ruff check scripts --output-format concise || true
            fail=1
          fi
          if [ "$ty_n" -gt "$TY_BASELINE" ]; then
            echo "::error::ty found $ty_n diagnostics, baseline is $TY_BASELINE - this change adds type debt"
            uv run ty check . --output-format concise || true
            fail=1
          fi
          exit $fail
