[project]
name = "ai-enablement-hub-backend"
version = "0.1.0"
description = "AI Enablement Hub backend — FastAPI + async SQLAlchemy on Azure PostgreSQL"
requires-python = "~=3.13"
dependencies = [
    "fastapi~=0.135",
    "uvicorn[standard]~=0.44",
    "sqlalchemy~=2.0",
    # asyncpg is a main dep (not prod-extra as in the template): dev runs against
    # Azure PostgreSQL too, so the PG driver is always needed.
    "asyncpg~=0.30",
    "alembic~=1.18",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "bcrypt~=4.2",
    "pyjwt~=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=1.0",
    "pytest-cov~=6.0",
    "httpx~=0.28",
    "aiosqlite~=0.20",
    "ruff~=0.11",
    "poethepoet~=0.30",
]
prod = [
    "httptools",
]

[tool.poe.tasks]
dev = "python -m src.main"
startup = "python startup.py"
test = "pytest tests -v"
format = "ruff format ."
lint = "ruff check ."
ty = "uvx ty check ."
migrate = "alembic revision --autogenerate -m"
upgrade = "alembic upgrade head"
downgrade = "alembic downgrade -1"
history = "alembic history"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
