[project]
name = "ai-enablement-hub-backend"
version = "0.1.0"
description = "AI Enablement Hub backend — FastAPI + async SQLAlchemy on Azure PostgreSQL"
requires-python = "~=3.13"
dependencies = [
    "fastapi~=0.135",
    "uvicorn[standard]~=0.44",
    "sqlalchemy~=2.0",
    # asyncpg is a main dep (not prod-extra as in the template): dev runs against
    # Azure PostgreSQL too, so the PG driver is always needed.
    "asyncpg~=0.30",
    "alembic~=1.18",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "email-validator~=2.2",
    "bcrypt~=5.0",
    "pyjwt~=2.10",
    # Entra ID login: httpx does the server-side code exchange; cryptography is
    # required by PyJWT for RS256 id_token verification.
    "httpx~=0.28",
    "cryptography~=45.0",
    "azure-communication-email~=1.1",
    # Per-project email templates: admins author subject/body in Markdown; the
    # backend renders it to HTML (raw HTML disabled) at send time.
    "markdown-it-py~=3.0",
    # Lesson media: private Blob Storage container + read-time SAS URLs.
    "azure-storage-blob~=12.24",
    # Multipart form parsing for the (upcoming) media upload endpoint.
    "python-multipart~=0.0.20",
    # LLM provider SDK. A main dependency, not the prod extra: llm_service imports it at module
    # level, so the app cannot start without it. Bounded to the 1.x line; a 2.x bump is a
    # deliberate PR (read the SDK's MIGRATION.md first).
    "anthropic~=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=1.0",
    "pytest-cov~=6.0",
    "httpx~=0.28",
    # anthropic 1.x is built on httpx2; tests that construct SDK errors need httpx2 objects.
    "httpx2~=2.13",
    "aiosqlite~=0.20",
    "ruff~=0.11",
    "poethepoet~=0.30",
    "pytest-xdist>=3.8.0",
    # Auto-retry integration tests once on failure — they hit a real remote
    # Postgres and occasionally see a transient blip under parallel load.
    "pytest-rerunfailures>=15.0",
]
prod = [
    "httptools",
]

[tool.poe.tasks]
dev = "python -m src.main"
startup = "python startup.py"
test = "pytest tests -v -n auto"
format = "ruff format ."
# CI-facing variants: format-check never writes; lint-src scopes to the app, tests and
# migrations (backend/scripts carries pre-existing findings owned by the 2026-07-31 fix
# programme and is linted by the non-required "staged" CI job instead).
format-check = "ruff format --check ."
lint = "ruff check ."
lint-src = "ruff check src tests alembic"
ty = "uvx ty check ."
migrate = "alembic revision --autogenerate -m"
upgrade = "alembic upgrade head"
downgrade = "alembic downgrade -1"
history = "alembic history"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the session-scoped async engine (remote PG)
# must live on the same loop as the tests that use it (asyncpg pins connections
# to their creating loop).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: no I/O, mocked repositories",
    "integration: runs against the ai-enablement-hub-test PostgreSQL database",
]

[tool.coverage.run]
# Async SQLAlchemy runs DB calls through greenlets; without this, coverage
# loses trace of every coroutine that resumes after a greenlet switch and
# under-reports executed code (SQLAlchemy docs recommend this setting).
concurrency = ["greenlet", "thread"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
